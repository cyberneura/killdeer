name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  # PR でもテストを走らせ、マージ前に落とす。リリース作成は下の
  # `github.ref == 'refs/heads/main'` で従来どおり main に限られる。
  pull_request:

# 既定は読み取りのみ。書き込みが要るのは release job だけで、そこにだけ与える。
# test job は PR のコードを `swift test` で実行する = PR が持ち込んだ任意のコードが
# 走るので、そこに contents: write のトークンを置いてはいけない。
permissions:
  contents: read

jobs:
  # リリースの門番。PR でもここだけが走る。
  test:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      # KilldeerCoreTests は ProcessDetector の判定ロジック (暴走判定・
      # 孤児 Chrome Helper 判定) を見ている。ここが狂うと無関係なプロセスを
      # 落としかねないので、配布物を作る前に通す。
      - name: Test
        run: swift test

  release:
    needs: test
    # PR では走らせない。main への push と workflow_dispatch のみ。
    if: github.event_name != 'pull_request'
    runs-on: macos-14
    # gh release create と VERSION の bump commit に必要。
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build Killdeer CLI
        run: swift build -c release --product killdeer

      - name: Build Killdeer App
        run: swift build -c release --product killdeer-app

      - name: Package binaries
        run: |
          mkdir -p dist
          cp .build/release/killdeer dist/killdeer
          cp .build/release/killdeer-app dist/killdeer-app
          cp README.md dist/
          cd dist
          zip -r killdeer-macos.zip killdeer killdeer-app README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: killdeer-macos
          path: dist/killdeer-macos.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG_NAME="v${VERSION}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES="Release ${TAG_NAME} (commit ${{ github.sha }})

          Changes:
          $(git log "${PREV_TAG}..HEAD" --oneline 2>/dev/null || echo "initial release")"
          else
            NOTES="Release ${TAG_NAME} (commit ${{ github.sha }})"
          fi
          gh release create "$TAG_NAME" \
            dist/killdeer-macos.zip \
            --title "Killdeer ${TAG_NAME}" \
            --notes "$NOTES"

      - name: Bump patch version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          IFS=. read -r major minor patch <<< "$VERSION"
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "$NEW_VERSION" > VERSION
          git config user.name "Casper (bot)"
          git config user.email "casper@cyberneura.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push
