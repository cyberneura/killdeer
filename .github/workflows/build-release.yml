name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true

      - name: Build Killdeer CLI
        run: swift build -c release --product killdeer

      - name: Build Killdeer App
        run: swift build -c release --product killdeer-app

      - name: Package binaries
        run: |
          mkdir -p dist
          cp .build/release/killdeer dist/killdeer
          cp .build/release/killdeer-app dist/killdeer-app
          cp README.md dist/
          cd dist
          zip -r killdeer-macos.zip killdeer killdeer-app README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: killdeer-macos
          path: dist/killdeer-macos.zip

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          TAG_NAME="v${VERSION}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES="Release ${TAG_NAME} (commit ${{ github.sha }})

          Changes:
          $(git log "${PREV_TAG}..HEAD" --oneline 2>/dev/null || echo "initial release")"
          else
            NOTES="Release ${TAG_NAME} (commit ${{ github.sha }})"
          fi
          gh release create "$TAG_NAME" \
            dist/killdeer-macos.zip \
            --title "Killdeer ${TAG_NAME}" \
            --notes "$NOTES"

      - name: Bump patch version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IFS=. read -r major minor patch < VERSION
          NEW_VERSION="${major}.${minor}.$((patch + 1))"
          echo "$NEW_VERSION" > VERSION
          git config user.name "Casper (bot)"
          git config user.email "casper@cyberneura.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW_VERSION} [skip ci]"
          git push